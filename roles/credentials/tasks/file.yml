---
# use_cyberark: false. Ansible already loaded group_vars/all/credentials.yml
# with the inventory (decrypting it if it is vault-encrypted and a vault
# password was given). Here we only confirm the file exists and say how it is
# protected; values are counted in main.yml.
- name: Credentials | Locate credentials.yml for this inventory
  ansible.builtin.set_fact:
    credentials_file: "{{ _inv_dir }}/group_vars/all/credentials.yml"
  vars:
    _inv_src: "{{ ansible_inventory_sources | first }}"
    _inv_dir: "{{ _inv_src if _inv_src is directory else (_inv_src | dirname) }}"

- name: Credentials [file] credentials.yml exists
  ansible.builtin.stat:
    path: "{{ credentials_file }}"
  register: _cred_stat

- name: Credentials [file] credentials.yml exists
  ansible.builtin.assert:
    that: _cred_stat.stat.exists
    fail_msg: >-
      {{ credentials_file }} not found. Copy credentials.yml.example next to it,
      fill it in, and encrypt it with ansible-vault (or set use_cyberark: true)
    quiet: true

- name: Credentials | Check whether credentials.yml is vault-encrypted
  ansible.builtin.command:
    argv: [grep, -c, -E, '^\$ANSIBLE_VAULT|!vault', "{{ credentials_file }}"]
  register: _cred_vault
  changed_when: false
  failed_when: _cred_vault.rc > 1
  check_mode: false

- name: Credentials | Remember how the file is protected
  ansible.builtin.set_fact:
    credentials_file_encrypted: "{{ (_cred_vault.stdout | int) > 0 }}"

- name: Credentials | Warn about a plain-text credentials file
  ansible.builtin.include_role:
    name: run_logging
    tasks_from: log
  vars:
    log_level: WARN
    log_step: credentials
    log_message: >-
      source=file env={{ murex_env }} file={{ credentials_file }} encrypted=no;
      plain text is for a throwaway test VM only. Encrypt it with: ansible-vault encrypt {{ credentials_file }}
  when: not credentials_file_encrypted

- name: Credentials | Log the file source
  ansible.builtin.include_role:
    name: run_logging
    tasks_from: log
  vars:
    log_step: credentials
    log_message: "source=file env={{ murex_env }} file={{ credentials_file }} encrypted={{ 'yes' if credentials_file_encrypted else 'no' }}"
