---
# Overwrite every credential variable with "" on every host. Called from the
# always: block at the end of each playbook and from the credentials rescue.
# (The ansible-playbook process still holds what it read from the inventory
# files until it exits; set_fact outranks inventory vars, so nothing later in
# the run can template the old values.)
- name: Credentials | Overwrite credential variables with empty values
  ansible.builtin.set_fact:
    mx_ssh_user: ""
    mx_ssh_password: ""
    ora_ssh_user: ""
    ora_ssh_password: ""
    db_admin_user: ""
    db_admin_password: ""
    jfrog_user: ""
    jfrog_token: ""
    _cyberark_values: {}
    credentials_loaded: false
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['all'] + ['localhost'] }}"
  no_log: true

- name: Credentials | Log cleared
  ansible.builtin.include_role:
    name: run_logging
    tasks_from: log
  vars:
    log_step: credentials
    log_message: "credentials cleared hosts={{ groups['all'] | length }}"
