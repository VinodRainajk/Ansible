---
# Section 1. Runs on localhost, once per run. Loads the credential variables
# from the file or CyberArk, checks they are all set, and copies them to every
# inventory host so later plays can use them (per task, via environment:).
# Values never appear in output: every task that reads them is no_log.
- name: Credentials | Load once per run
  when: not (credentials_loaded | default(false))
  block:
    - name: Credentials [flag] use_cyberark is true or false
      ansible.builtin.assert:
        that: (use_cyberark | string | lower) in ['true', 'false', 'yes', 'no']
        fail_msg: "use_cyberark must be true or false, got '{{ use_cyberark }}'"
        quiet: true

    - name: Credentials | Pick the source
      ansible.builtin.set_fact:
        credentials_source: "{{ 'cyberark' if use_cyberark | bool else 'file' }}"

    - name: Credentials | Load from {{ credentials_source }}
      ansible.builtin.include_tasks: "{{ credentials_source }}.yml"

    - name: Credentials [complete] find which variables are set
      ansible.builtin.set_fact:
        _cred_present: "{{ (_cred_present | default([])) + [item] }}"
      loop: "{{ credential_names }}"
      loop_control:
        label: "{{ item }}"
      when: (lookup('ansible.builtin.vars', item, default='') | string | length) > 0

    - name: Credentials [complete] find placeholders
      ansible.builtin.set_fact:
        _cred_placeholder: "{{ (_cred_placeholder | default([])) + [item] }}"
      loop: "{{ credential_names }}"
      loop_control:
        label: "{{ item }}"
      when: lookup('ansible.builtin.vars', item, default='') | string is search('CHANGE_ME')

    - name: Credentials [complete] find undefined optional variables
      ansible.builtin.set_fact:
        _cred_undefined: "{{ (_cred_undefined | default([])) + [item] }}"
      loop: "{{ credential_optional }}"
      loop_control:
        label: "{{ item }}"
      when: lookup('ansible.builtin.vars', item, default='__undefined__') == '__undefined__'

    - name: Credentials [complete] every variable is set
      ansible.builtin.assert:
        that:
          - _cred_missing | length == 0
          - _cred_placeholder | default([]) | length == 0
        fail_msg: >-
          missing or empty: {{ _cred_missing | join(', ') | default('none', true) }};
          still CHANGE_ME: {{ _cred_placeholder | default([]) | join(', ') | default('none', true) }}
        quiet: true
      vars:
        _cred_missing: >-
          {{ (credential_names | difference(_cred_present | default([])) | reject('in', credential_optional) | list)
             + (_cred_undefined | default([])) }}

    - name: Credentials | Copy the variables to every host
      ansible.builtin.set_fact:
        mx_ssh_user: "{{ mx_ssh_user }}"
        mx_ssh_password: "{{ mx_ssh_password | default('') }}"
        ora_ssh_user: "{{ ora_ssh_user }}"
        ora_ssh_password: "{{ ora_ssh_password | default('') }}"
        db_admin_user: "{{ db_admin_user }}"
        db_admin_password: "{{ db_admin_password }}"
        jfrog_user: "{{ jfrog_user }}"
        jfrog_token: "{{ jfrog_token }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] + ['localhost'] }}"
      no_log: true

    - name: Credentials | Log loaded
      ansible.builtin.include_role:
        name: run_logging
        tasks_from: log
      vars:
        log_step: credentials
        log_message: >-
          source={{ credentials_source }} env={{ murex_env }}
          loaded={{ _cred_present | default([]) | length }} keys
          hosts={{ groups['all'] | length }}

    # Last task of the block: the block's when is re-checked before every task.
    - name: Credentials | Mark loaded
      ansible.builtin.set_fact:
        credentials_loaded: true
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] + ['localhost'] }}"

  rescue:
    - name: Credentials | Log the failure
      ansible.builtin.include_role:
        name: run_logging
        tasks_from: log
      vars:
        log_level: ERROR
        log_step: credentials
        log_message: >-
          source={{ credentials_source | default('unknown') }} env={{ murex_env }}
          check={{ ansible_failed_task.name | regex_search('\[(\w+)\]', '\1') | default(['load'], true) | first }}
          detail={{ ansible_failed_result.msg | default('unknown error') | truncate(400) }}

    - name: Credentials | Clear anything partly loaded
      ansible.builtin.include_tasks: clear.yml

    - name: Credentials | Stop the run
      ansible.builtin.fail:
        msg: "Credentials could not be loaded; nothing was changed on any host. See {{ hostvars['localhost']['run_log_file'] }}"
