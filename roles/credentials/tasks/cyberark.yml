---
# use_cyberark: true. Fetch every account in cyberark_accounts from CCP and set
# the user_var / secret_var named in each entry. Values are never logged.
- name: Credentials [cyberark_config] CCP settings are filled in
  ansible.builtin.assert:
    that:
      - cyberark_ccp_url is match('^https?://')
      - cyberark_ccp_url is not search('(?i)change[-_]me')
      - cyberark_app_id | length > 0
      - cyberark_app_id is not search('(?i)change[-_]me')
      - cyberark_accounts | default([]) | length > 0
      - cyberark_accounts | rejectattr('safe', 'defined') | list | length == 0
      - cyberark_accounts | rejectattr('object', 'defined') | list | length == 0
      - cyberark_accounts | selectattr('safe', 'search', '(?i)change[-_]me') | list | length == 0
      - cyberark_accounts | selectattr('object', 'search', '(?i)change[-_]me') | list | length == 0
      - (cyberark_accounts | map(attribute='user_var') | list + cyberark_accounts | map(attribute='secret_var') | list)
        | difference(credential_names) | length == 0
    fail_msg: >-
      use_cyberark is true but cyberark_ccp_url, cyberark_app_id or cyberark_accounts in
      group_vars/all/main.yml are missing, still CHANGE_ME, or map to unknown variable names
      (allowed: {{ credential_names | join(', ') }})
    quiet: true

- name: Credentials [cyberark_connect] reach the CCP web service
  ansible.builtin.uri:
    url: "{{ cyberark_ccp_url | regex_replace('/+$', '') }}/AIMWebService/api/Accounts?AppId={{ cyberark_app_id | urlencode }}"
    method: GET
    validate_certs: "{{ cyberark_validate_certs | bool }}"
    client_cert: "{{ cyberark_client_cert | default(omit, true) }}"
    client_key: "{{ cyberark_client_key | default(omit, true) }}"
    timeout: "{{ cyberark_timeout | int }}"
    # Any HTTP answer means CCP is up; a query-less request is normally rejected.
    status_code: [200, 400, 401, 403, 404]
  register: _ccp_connect

- name: Credentials | Log CCP connect
  ansible.builtin.include_role:
    name: run_logging
    tasks_from: log
  vars:
    log_step: credentials
    log_message: >-
      source=cyberark connect=ok url={{ cyberark_ccp_url | urlsplit('hostname') }}
      app_id={{ cyberark_app_id }} http_status={{ _ccp_connect.status }}

- name: Credentials | Fetch each account
  ansible.builtin.include_tasks: cyberark_fetch.yml
  loop: "{{ cyberark_accounts }}"
  loop_control:
    loop_var: cyberark_account
    label: "{{ cyberark_account.name | default(cyberark_account.object) }}"

- name: Credentials | Set the credential variables
  ansible.builtin.set_fact:
    mx_ssh_user: "{{ _cyberark_values.mx_ssh_user | default('') }}"
    mx_ssh_password: "{{ _cyberark_values.mx_ssh_password | default('') }}"
    ora_ssh_user: "{{ _cyberark_values.ora_ssh_user | default('') }}"
    ora_ssh_password: "{{ _cyberark_values.ora_ssh_password | default('') }}"
    db_admin_user: "{{ _cyberark_values.db_admin_user | default('') }}"
    db_admin_password: "{{ _cyberark_values.db_admin_password | default('') }}"
    jfrog_user: "{{ _cyberark_values.jfrog_user | default('') }}"
    jfrog_token: "{{ _cyberark_values.jfrog_token | default('') }}"
    _cyberark_values: {}
  no_log: true
