---
# One CyberArk account. Input: cyberark_account (name, safe, object, user_var, secret_var).
- name: Credentials [cyberark_fetch] fetch {{ cyberark_account.object }}
  cyberark.pas.cyberark_credential:
    api_base_url: "{{ cyberark_ccp_url | regex_replace('/+$', '') }}"
    app_id: "{{ cyberark_app_id }}"
    query: "Safe={{ cyberark_account.safe }};Object={{ cyberark_account.object }}"
    validate_certs: "{{ cyberark_validate_certs | bool }}"
    client_cert: "{{ cyberark_client_cert | default(omit, true) }}"
    client_key: "{{ cyberark_client_key | default(omit, true) }}"
    connection_timeout: "{{ cyberark_timeout | int }}"
    reason: "murex-ansible run {{ run_id }}"
  register: _cyberark_one
  failed_when: false
  no_log: true

- name: Credentials [cyberark_fetch] got a value for {{ cyberark_account.object }}
  ansible.builtin.assert:
    that:
      - _cyberark_one.result is defined
      - (_cyberark_one.result.Content | default('') | length) > 0
    fail_msg: >-
      source=cyberark object={{ cyberark_account.object }} safe={{ cyberark_account.safe }}
      http_status={{ _cyberark_one.status_code | default('none') }}
      error={{ (_cyberark_one.msg | default('no Content in CCP response')) | regex_replace('\s+', ' ') | truncate(300) }}
    quiet: true

- name: Credentials | Keep the value for {{ cyberark_account.object }}
  ansible.builtin.set_fact:
    _cyberark_values: >-
      {{ _cyberark_values | default({}) | combine({
           cyberark_account.user_var: _cyberark_one.result.UserName | default(_cyberark_one.result.Username | default('')),
           cyberark_account.secret_var: _cyberark_one.result.Content }) }}
  no_log: true

- name: Credentials | Log fetched {{ cyberark_account.object }}
  ansible.builtin.include_role:
    name: run_logging
    tasks_from: log
  vars:
    log_step: credentials
    log_message: >-
      source=cyberark fetched object={{ cyberark_account.object }} safe={{ cyberark_account.safe }}
      sets={{ cyberark_account.user_var }},{{ cyberark_account.secret_var }}
