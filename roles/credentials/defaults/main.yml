---
# false: values come from inventories/<env>/group_vars/all/credentials.yml
# true:  values come from CyberArk CCP (cyberark_* settings in group_vars/all/main.yml)
use_cyberark: false

# Every source must produce exactly these variables.
credential_names:
  - mx_ssh_user
  - mx_ssh_password
  - ora_ssh_user
  - ora_ssh_password
  - db_admin_user
  - db_admin_password
  - jfrog_user
  - jfrog_token

# May be "" (SSH key logins). They must still be defined.
credential_optional:
  - mx_ssh_password
  - ora_ssh_password

cyberark_validate_certs: true
cyberark_client_cert: ""
cyberark_client_key: ""
cyberark_timeout: 30
