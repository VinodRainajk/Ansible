---
# Promote a UAT-certified candidate to the gold path in JFrog. After UAT sign-off only.
# STUB: runs preflight (Section 0) and credentials (Section 1), then stops with
# "not implemented yet". The real steps arrive with Section 7.
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml
  vars:
    run_playbook: promote-gold

- name: Credentials
  ansible.builtin.import_playbook: common/load_credentials.yml

- name: Not implemented yet
  ansible.builtin.import_playbook: common/not_implemented.yml
  vars:
    stub_section: "Section 7 (promote a UAT-certified candidate to gold)"
