---
# Orchestrator: full rebuild of DB and app. Planned order: validate DB, app ->
# safety backup (DB dump, then MX home) -> stop MX -> DB cleanup + impdp gold ->
# app cleanup + gold install + config -> start MX + smoke -> patch (DB, app) ->
# candidate backup.
# STUB: runs preflight (Section 0) and credentials (Section 1), then stops with
# "not implemented yet". The real steps arrive with Sections 2-7.
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml
  vars:
    run_playbook: rebuild

- name: Credentials
  ansible.builtin.import_playbook: common/load_credentials.yml

- name: Not implemented yet
  ansible.builtin.import_playbook: common/not_implemented.yml
  vars:
    stub_section: "Sections 2-7 (orchestrated full rebuild)"
