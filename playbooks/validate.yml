---
# Orchestrator: validate DB, then app.
# STUB: runs preflight (Section 0) and credentials (Section 1), then stops with
# "not implemented yet". The real steps arrive with Section 2.
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml
  vars:
    run_playbook: validate

- name: Credentials
  ansible.builtin.import_playbook: common/load_credentials.yml

- name: Validate the Oracle host
  ansible.builtin.import_playbook: db/validate.yml
  vars:
    orchestrated: true

- name: Validate the app VM
  ansible.builtin.import_playbook: app/validate.yml
  vars:
    orchestrated: true

- name: End of run
  ansible.builtin.import_playbook: common/end_run.yml
