# STUB: runs preflight (Section 0) and credentials (Section 1), then stops with
# "not implemented yet". The real steps arrive with Sections 3-5.
- name: Preflight
  ansible.builtin.import_playbook: ../preflight.yml
  vars:
    run_playbook: app-rebuild

- name: Credentials
  ansible.builtin.import_playbook: ../common/load_credentials.yml

- name: Not implemented yet
  ansible.builtin.import_playbook: ../common/not_implemented.yml
  vars:
    stub_section: "Sections 3-5 (app backup, cleanup, gold install, config)"
