---
# Sections 0 + 1 on their own: preflight, load credentials, clear them.
# ansible-playbook -i inventories/<env> playbooks/credentials.yml [--ask-vault-pass]
- name: Preflight
  ansible.builtin.import_playbook: preflight.yml
  vars:
    run_playbook: credentials

- name: Credentials
  ansible.builtin.import_playbook: common/load_credentials.yml

- name: End of run
  ansible.builtin.import_playbook: common/end_run.yml
